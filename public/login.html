<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Portal | Synthetix Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body class="bg-mesh-pattern min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full card-glass rounded-3xl p-8 border border-purple-500/30 shadow-2xl relative">
    
    <!-- LOGO NEXUS BRANDING -->
    <div class="text-center mb-6">
      <a href="/" class="inline-flex items-center space-x-2.5 mb-3 group">
        <div class="relative flex items-center justify-center">
          <div class="absolute -inset-1 bg-gradient-to-r from-purple-600 to-fuchsia-600 rounded-xl blur-sm opacity-60 group-hover:opacity-100 transition"></div>
          <div class="relative w-9 h-9 rounded-xl bg-[#0b0517] border border-purple-400/40 flex items-center justify-center shadow-inner">
            <svg class="w-4 h-4 text-purple-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
        </div>
        <span class="font-black text-lg text-white tracking-wider">SYNTHETIX<span class="text-purple-400">.PORTAL</span></span>
      </a>
      <h2 id="portalTitle" class="text-2xl font-black text-white">Iniciar Sesión</h2>
      <p id="portalSub" class="text-purple-300/60 text-xs mt-1">Accede a tus proyectos, builds y tickets técnicos</p>
    </div>

    <!-- AVISO DE ERROR SI FALLA DISCORD -->
    <div id="discordErrorAlert" class="hidden p-3 rounded-xl bg-amber-950/60 border border-amber-500/50 text-amber-300 text-xs text-center mb-4">
      ⚠️ No se pudo conectar con Discord. Configura las variables en Cloudflare o entra con correo y contraseña.
    </div>

    <!-- BOTÓN DISCORD OAUTH2 -->
    <a href="/api/auth/discord" class="w-full flex items-center justify-center space-x-3 bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-indigo-500/25 mb-5">
      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      <span>Continuar con Discord</span>
    </a>

    <div class="relative flex py-2 items-center mb-5">
      <div class="flex-grow border-t border-purple-950"></div>
      <span class="flex-shrink mx-4 text-[10px] font-mono text-purple-400 uppercase">o con correo</span>
      <div class="flex-grow border-t border-purple-950"></div>
    </div>

    <!-- Switch de Pestañas -->
    <div class="flex p-1 bg-black/50 border border-purple-900/50 rounded-xl mb-5">
      <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition">Ingresar</button>
      <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-purple-300/70 hover:text-white transition">Registro</button>
    </div>

    <form id="authForm" class="space-y-3.5">
      <div id="usernameField" class="hidden">
        <label class="block text-xs font-mono uppercase text-purple-300 mb-1">Usuario</label>
        <input type="text" id="username" class="w-full bg-black/60 border border-purple-900 rounded-xl px-4 py-2.5 text-white text-xs focus:border-purple-400">
      </div>

      <div>
        <label class="block text-xs font-mono uppercase text-purple-300 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required class="w-full bg-black/60 border border-purple-900 rounded-xl px-4 py-2.5 text-white text-xs focus:border-purple-400">
      </div>

      <div id="discordField" class="hidden">
        <label class="block text-xs font-mono uppercase text-purple-300 mb-1">Usuario de Discord</label>
        <input type="text" id="discord" class="w-full bg-black/60 border border-purple-900 rounded-xl px-4 py-2.5 text-white text-xs focus:border-purple-400">
      </div>

      <div>
        <label class="block text-xs font-mono uppercase text-purple-300 mb-1">Contraseña</label>
        <input type="password" id="password" required class="w-full bg-black/60 border border-purple-900 rounded-xl px-4 py-2.5 text-white text-xs focus:border-purple-400">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-purple-600/30">
        Entrar a Synthetix
      </button>

      <p id="authStatus" class="text-center text-xs font-medium hidden mt-2"></p>
    </form>

    <div class="mt-6 pt-4 border-t border-purple-900/30 text-center">
      <a href="/" class="text-xs text-purple-400 hover:text-white transition flex items-center justify-center space-x-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Volver a la web</span>
      </a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'discord_failed' || urlParams.get('error') === 'no_code') {
      document.getElementById('discordErrorAlert').classList.remove('hidden');
    }

    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      const u = document.getElementById('usernameField');
      const d = document.getElementById('discordField');
      const tL = document.getElementById('tabLogin');
      const tR = document.getElementById('tabRegister');
      const btn = document.getElementById('submitBtn');

      if (mode === 'register') {
        u.classList.remove('hidden');
        d.classList.remove('hidden');
        tR.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition";
        tL.className = "flex-1 py-2 text-xs font-bold rounded-lg text-purple-300/70 hover:text-white transition";
        btn.innerText = "Crear Cuenta";
      } else {
        u.classList.add('hidden');
        d.classList.add('hidden');
        tL.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition";
        tR.className = "flex-1 py-2 text-xs font-bold rounded-lg text-purple-300/70 hover:text-white transition";
        btn.innerText = "Entrar a Synthetix";
      }
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('authStatus');
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const endpoint = currentMode === 'register' ? '/api/auth/register' : '/api/auth/login';
      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };
      if (currentMode === 'register') {
        payload.username = document.getElementById('username').value;
        payload.discord = document.getElementById('discord').value;
      }

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          localStorage.setItem('synthetix_token', data.token);
          localStorage.setItem('synthetix_user', JSON.stringify(data.user));
          status.innerText = `¡Bienvenido, ${data.user.username}!`;
          status.className = "text-center text-xs text-purple-300 block font-semibold mt-2";
          setTimeout(() => { window.location.href = '/dashboard'; }, 800);
        } else {
          throw new Error(data.error || "Credenciales inválidas");
        }
      } catch (err) {
        status.innerText = err.message;
        status.className = "text-center text-xs text-rose-400 block font-semibold mt-2";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
