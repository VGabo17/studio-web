<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Portal | Synthetix Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body class="bg-mesh-pattern min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full card-glass rounded-3xl p-8 border border-purple-500/30 shadow-2xl relative">
    
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center space-x-2 mb-4 group">
        <div class="w-8 h-8 rounded-lg bg-purple-950 border border-purple-500/50 flex items-center justify-center">
          <i data-lucide="terminal" class="w-4 h-4 text-purple-300"></i>
        </div>
        <span class="font-bold text-lg text-white tracking-wider">SYNTHETIX<span class="text-purple-400">.PORTAL</span></span>
      </a>
      <h2 id="portalTitle" class="text-2xl font-black text-white">Iniciar Sesión</h2>
      <p id="portalSub" class="text-purple-300/60 text-xs mt-1">Accede a tus proyectos, servicios y tickets</p>
    </div>

    <div class="flex p-1 bg-black/50 border border-purple-900/50 rounded-xl mb-6">
      <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition">Ingresar</button>
      <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-purple-300/70 hover:text-white transition">Crear Cuenta</button>
    </div>

    <form id="authForm" class="space-y-4">
      <div id="usernameField" class="hidden">
        <label class="block text-xs font-mono uppercase text-purple-300 mb-1">Nombre de Usuario</label>
        <input type="text" id="username" class="w-full bg-black/60 border border-purple-900/60 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-400 transition" placeholder="vgabo17">
      </div>

      <div>
        <label class="block text-xs font-mono uppercase text-purple-300 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required class="w-full bg-black/60 border border-purple-900/60 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-400 transition" placeholder="tu@correo.com">
      </div>

      <div id="discordField" class="hidden">
        <label class="block text-xs font-mono uppercase text-purple-300 mb-1">Usuario de Discord (Opcional)</label>
        <input type="text" id="discord" class="w-full bg-black/60 border border-purple-900/60 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-400 transition" placeholder="gabo#0000 o gabodev">
      </div>

      <div>
        <label class="block text-xs font-mono uppercase text-purple-300 mb-1">Contraseña</label>
        <input type="password" id="password" required class="w-full bg-black/60 border border-purple-900/60 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-400 transition" placeholder="••••••••">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 text-white font-bold py-3 rounded-xl text-sm transition duration-200 shadow-lg shadow-purple-600/30 mt-2">
        Entrar a Synthetix
      </button>

      <p id="authStatus" class="text-center text-xs font-medium hidden mt-2"></p>
    </form>

    <div class="mt-6 pt-4 border-t border-purple-900/30 text-center">
      <a href="/" class="text-xs text-purple-400/80 hover:text-purple-300 transition flex items-center justify-center space-x-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Volver al sitio principal</span>
      </a>
    </div>

  </div>

  <script>
    lucide.createIcons();
    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      const uField = document.getElementById('usernameField');
      const dField = document.getElementById('discordField');
      const tabLogin = document.getElementById('tabLogin');
      const tabReg = document.getElementById('tabRegister');
      const title = document.getElementById('portalTitle');
      const sub = document.getElementById('portalSub');
      const submitBtn = document.getElementById('submitBtn');
      const status = document.getElementById('authStatus');
      status.classList.add('hidden');

      if (mode === 'register') {
        uField.classList.remove('hidden');
        dField.classList.remove('hidden');
        tabReg.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition";
        tabLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg text-purple-300/70 hover:text-white transition";
        title.innerText = "Crear Cuenta";
        sub.innerText = "El primer usuario registrado obtendrá el rol Founder";
        submitBtn.innerText = "Registrarse en la Plataforma";
      } else {
        uField.classList.add('hidden');
        dField.classList.add('hidden');
        tabLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition";
        tabReg.className = "flex-1 py-2 text-xs font-bold rounded-lg text-purple-300/70 hover:text-white transition";
        title.innerText = "Iniciar Sesión";
        sub.innerText = "Accede a tus proyectos, servicios y tickets";
        submitBtn.innerText = "Entrar a Synthetix";
      }
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('authStatus');
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Procesando...";

      const endpoint = currentMode === 'register' ? '/api/auth/register' : '/api/auth/login';
      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      if (currentMode === 'register') {
        payload.username = document.getElementById('username').value;
        payload.discord = document.getElementById('discord').value;
      }

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('synthetix_token', data.token);
          localStorage.setItem('synthetix_user', JSON.stringify(data.user));

          status.innerText = `¡Éxito! Rol: ${data.user.role}. Entrando al portal...`;
          status.className = "text-center text-xs text-purple-300 block font-semibold mt-2";

          // Redirección Limpia sin .html
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1200);
        } else {
          throw new Error(data.error || "Ocurrió un error");
        }
      } catch (err) {
        status.innerText = err.message;
        status.className = "text-center text-xs text-rose-400 block font-semibold mt-2";
      } finally {
        btn.disabled = false;
        btn.innerText = currentMode === 'register' ? "Registrarse en la Plataforma" : "Entrar a Synthetix";
      }
    });
  </script>
</body>
</html>
